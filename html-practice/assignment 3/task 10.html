<!DOCTYPE html>
<html>

<head>
    <title>Travel Selection Page</title>
</head>

<body bgcolor="pink">

    <h1>Travel Destination Selection</h1>

    <p>Select your travel preferences:</p>

    <form>

        <label>Country:</label>
        <select name="country">
            <option value="india" selected>India</option>
            <option value="france">France</option>
            <option value="japan">Japan</option>
            <option value="uae">UAE</option>
        </select>

        <br><br>

        <label>State:</label>
        <select name="state">
            <option value="maharashtra" selected>Maharashtra</option>
            <option value="goa">Goa</option>
            <option value="kerala">Kerala</option>
            <option value="rajasthan">Rajasthan</option>
        </select>

        <br><br>

        <label>City:</label>
        <select name="city">
            <option value="mumbai" selected>Mumbai</option>
            <option value="pune">Pune</option>
            <option value="goa">Goa</option>
            <option value="jaipur">Jaipur</option>
        </select>

        <br><br>

        <label>Favorite Tourist Place:</label>
        <select name="tourist_place">
            <option value="gateway" selected>Gateway of India</option>
            <option value="tajmahal">Taj Mahal</option>
            <option value="eiffel">Eiffel Tower</option>
            <option value="redfort">Red Fort</option>
        </select>

    </form>

    <hr>

    <h2>Your Choices</h2>

    <p>
        My selected country is <b>India</b>, my state is
        <b>Maharashtra</b>, my city is <b>Mumbai</b>, and my
        favorite tourist place is <b>Gateway of India</b>.
    </p>

</body>

</html>
