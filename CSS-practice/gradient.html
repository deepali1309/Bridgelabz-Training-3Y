<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Gradients</title>
    <style>
        .box{
            width: 300px;
            height: 150px;
            background: radial-gradient(
               
                beige,
                purple,
                rgb(243, 243, 104),
                rgb(188, 110, 123)
    
            ) ;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
        }
    </style>
</head>
<body>
    <div class="box">
        Hotstar
    </div>
    
</body>
</html>
