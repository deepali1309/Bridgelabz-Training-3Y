<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Photo Gallery</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        /* Responsive Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1100px;
            margin: auto;
        }

        /* Image container */
        .photo {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        /* Images */
        .photo img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        /* Caption */
        .caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: rgb(164, 115, 115);
            text-align: center;

            opacity: 0;
            transition: opacity 0.4s ease;
        }

        /* Hover Effects */
        .photo:hover img {
            transform: scale(1.1);
        }

        .photo:hover .caption {
            opacity: 1;
        }

        /* Tablet */
        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Mobile */
        @media (max-width: 500px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <div class="photo">
            <img src="https://picsum.photos/id/1015/600/400" alt="Mountain">
            <div class="caption">Beautiful Mountain</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1016/600/400" alt="Forest">
            <div class="caption">Peaceful Forest</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1018/600/400" alt="Nature">
            <div class="caption">Amazing Nature</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1025/600/400" alt="Dog">
            <div class="caption">Cute Dog</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1035/600/400" alt="Beach">
            <div class="caption">Beautiful Beach</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1043/600/400" alt="River">
            <div class="caption">Calm River</div>
        </div>

    </div>

</body>
</html>
