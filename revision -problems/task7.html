<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <style>
        /* General styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #eaf2f8;
            color: #2c3e50;

            /* Center form vertically and horizontally */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Contact form container */
        .contact-container {
            width: 90%;
            max-width: 500px;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #1f618d;
        }

        /* Form fields */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #d5d8dc;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            font-size: 16px;
            outline: none;
        }

        /* Focus effect */
        input:focus,
        textarea:focus {
            border-color: #3498db;
            box-shadow: 0 0 6px rgba(52, 152, 219, 0.3);
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        /* Submit button */
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #1f618d;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #154360;
        }
    </style>
</head>

<body>

    <main class="contact-container">

        <h1>Contact Us</h1>

        <form action="#" method="post">

            <div class="form-group">
                <label for="name">Name</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    placeholder="Enter your name"
                    required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <input 
                    type="text" 
                    id="subject" 
                    name="subject" 
                    placeholder="Enter subject"
                    required>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea 
                    id="message" 
                    name="message" 
                    placeholder="Write your message..."
                    required></textarea>
            </div>

            <button type="submit">Send Message</button>

        </form>

    </main>

</body>
</html>
